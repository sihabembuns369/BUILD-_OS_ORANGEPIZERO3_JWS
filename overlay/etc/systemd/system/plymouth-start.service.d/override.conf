[Unit]
Description=Show Plymouth Boot Screen (Early Start)
DefaultDependencies=no
Wants=systemd-vconsole-setup.service
After=systemd-vconsole-setup.service
Before=sysinit.target systemd-udevd.service systemd-udev-trigger.service basic.target
ConditionKernelCommandLine=!plymouth.enable=0

[Service]
ExecStart=
ExecStart=/sbin/plymouthd --mode=boot --pid-file=/run/plymouth/pid --attach-to-session
ExecStartPost=-/bin/plymouth show-splash
Type=forking
KillMode=mixed
RemainAfterExit=yes
